<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - Prospect Workflow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-chart-line"></i> Prospect Workflow</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sequences.html" class="nav-link">
                        <i class="fas fa-layer-group"></i> Sequences
                    </a>
                </li>
                <li class="nav-item">
                    <a href="feedback.html" class="nav-link">
                        <i class="fas fa-lightbulb"></i> Feedback
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="config.html" class="nav-link">
                        <i class="fas fa-cog"></i> Configuration
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Workflow Configuration</h1>
                <button class="btn btn-secondary" id="refreshConfigBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </header>

            <!-- Info Card -->
            <div class="info-card">
                <i class="fas fa-info-circle"></i>
                <p>View the current workflow configuration. Changes to the configuration should be made through approved recommendations.</p>
            </div>

            <!-- Config Display -->
            <div class="card">
                <div class="card-header">
                    <h2>Current Configuration</h2>
                    <button class="btn btn-secondary" id="copyConfigBtn">
                        <i class="fas fa-copy"></i> Copy JSON
                    </button>
                </div>
                <div class="card-body">
                    <pre id="configDisplay" class="config-display">Loading configuration...</pre>
                </div>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
</body>
</html>
